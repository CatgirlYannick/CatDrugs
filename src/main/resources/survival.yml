# ============================================================
# CatDrugs - survival, dealers, loot, and crafting
# ============================================================
# All recipes are deliberately fictional Minecraft combinations.
# They do not represent real production methods.
# ============================================================

config-version: 1

features:
  village-dealers:
    enabled: true
  crafting:
    enabled: true
  loot:
    enabled: true
  cultivation:
    enabled: true

automatic-content:
  # Keeps every enabled substance obtainable even when it has no hand-written entry below.
  dealers:
    include-all-drugs: true
  recipes:
    enabled: true

utensils:
  # The drug stays in the main hand; its reusable utensil must be in the off-hand.
  category-defaults:
    cannabis: "herbal_pipe"
    depressant: "medicine_cup"
    dissociative: "filter_straw"
    herbal: "ritual_bowl"
    inhalant: "vaporizer"
    opioid: "sterile_applicator"
    party: "filter_straw"
    psychedelic: "ritual_bowl"
    sedative: "medicine_cup"
    stimulant: "filter_straw"
    synthetic: "vaporizer"
  overrides:
    joint: "lighter"
    edible: "ritual_bowl"
    caffeine: "medicine_cup"
    nicotine: "vaporizer"
    coca_leaf: "ritual_bowl"
    alcohol: "medicine_cup"
    absinthe: "medicine_cup"
    moonshine: "medicine_cup"
  preparation-required:
    weed: "joint"

village-dealers:
  display-name: "<light_purple><bold>Village Pharmacist</bold></light_purple>"
  show-name: true
  # Every generated vanilla village receives one persistent dealer.
  # The village structure stores a marker so chunk reloads cannot create duplicates.
  natural-village-spawning:
    enabled: true
    # Naturally spawned village dealers walk, look around, and use normal villager AI.
    ai-enabled: true
  # 0.35 means a 35 percent chance for each eligible nitwit.
  # This fallback is used for villagers outside detected village structures.
  conversion-chance: 0.35
  max-per-chunk: 1
  trades-per-dealer: 5
  allow-converting-employed-villagers: false
  allowed-worlds:
    - "world*"
  npc:
    stationary: true
    invulnerable: true
    silent: true
    no-collision: true
    villager-type: "SWAMP"

  trades:
    weed: {enabled: true, item: "weed", amount: 1, emerald-cost: 4, max-uses: 12, villager-xp: 4}
    hashish: {enabled: true, item: "hashish", amount: 1, emerald-cost: 6, max-uses: 10, villager-xp: 5}
    cocaine: {enabled: true, item: "cocaine", amount: 1, emerald-cost: 12, max-uses: 6, villager-xp: 8}
    meth: {enabled: true, item: "meth", amount: 1, emerald-cost: 14, max-uses: 6, villager-xp: 9}
    heroin: {enabled: true, item: "heroin", amount: 1, emerald-cost: 15, max-uses: 5, villager-xp: 10}
    mdma: {enabled: true, item: "mdma", amount: 1, emerald-cost: 10, max-uses: 8, villager-xp: 7}
    lsd: {enabled: true, item: "lsd", amount: 1, emerald-cost: 9, max-uses: 8, villager-xp: 7}
    mushrooms: {enabled: true, item: "mushrooms", amount: 1, emerald-cost: 7, max-uses: 10, villager-xp: 6}
    ketamine: {enabled: true, item: "ketamine", amount: 1, emerald-cost: 11, max-uses: 6, villager-xp: 8}
    opioids: {enabled: true, item: "opioids", amount: 1, emerald-cost: 10, max-uses: 7, villager-xp: 8}
    crack: {enabled: true, item: "crack", amount: 1, emerald-cost: 13, max-uses: 6, villager-xp: 9}
