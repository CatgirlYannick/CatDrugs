    joint: {enabled: false, item: "joint", amount: 1, emerald-cost: 5, max-uses: 10, villager-xp: 5}

loot:
  tables:
    village:
      table-contains: "village"
      item: "hemp_seed"
      chance: 0.28
      min-amount: 1
      max-amount: 3
    mineshaft:
      table-contains: "abandoned_mineshaft"
      item: "dried_herb"
      chance: 0.20
      min-amount: 1
      max-amount: 2
    stronghold:
      table-contains: "stronghold"
      item: "lsd"
      chance: 0.08
      min-amount: 1
      max-amount: 1
    dungeon:
      table-contains: "simple_dungeon"
      item: "oxycodone"
      chance: 0.09
      min-amount: 1
      max-amount: 1
    end-city:
      table-contains: "end_city_treasure"
      item: "dmt"
      chance: 0.10
      min-amount: 1
      max-amount: 1
    ancient-city:
      table-contains: "ancient_city"
      item: "fentanyl"
      chance: 0.06
      min-amount: 1
      max-amount: 1

cultivation:
  # Mature wheat crops may drop additional fantasy herbs.
  mature-wheat-drop-chance: 0.18

advanced-gameplay:
  progression:
    enabled: true
    # Tolerance shortens positive effect durations down to this multiplier.
    minimum-effectiveness: 0.45
    tolerance-message-level: 25
  withdrawal:
    enabled: true
    check-seconds: 60
    minimum-addiction: 20
    delay-minutes: 15
    message-cooldown-seconds: 180
    # Continued abstinence slowly lowers dependence and tolerance.
    recovery-after-minutes: 30
  mixing:
    enabled: true
    window-seconds: 120
    standard-extra-dose: 2
    hazardous-extra-dose: 4
  perception:
    enabled: true
    chance: 0.35
    duration-seconds: 18
  lab:
    enabled: true
    station-item: "alchemy_cauldron"
    processing-seconds: 5
    # Entirely fictional Minecraft transformations.
    processes:
      hemp_seed: "dried_herb"
      dried_herb: "weed"
      mushrooms: "psilocybin"
      coca_leaf: "caffeine"
      opium: "antidote"
  dealer-quests:
    enabled: true
    minimum-trades: 3
    maximum-trades: 6
    token-reward: 2
    token-rewards: ["joint", "mushrooms", "caffeine", "kratom", "kava"]
    targets:
      weed: true
      joint: true
      mushrooms: true
      caffeine: true
      kratom: true
      kava: true
  enforcement:
    enabled: true
    base-chance: 0.03
    patrol-size: 2
    lifetime-seconds: 45
    confiscate-one-item: true
  random-events:
    enabled: true
    supply-find-chance: 0.04
    supply-items: ["hemp_seed", "dried_herb", "empty_pouch"]

