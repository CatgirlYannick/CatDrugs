# ============================================================
# CatDrugs - substances and effects
# ============================================================
# Purpose:
#   Items, cooldowns, dose points, and potion effects.
#
# Effect rules:
#   - duration-seconds: 1 through 3600
#   - amplifier: 0 is level I, 1 is level II, and so on
#   - after-delay-ticks: 20 ticks equal one second
#
# Effects are abstract gameplay mechanics, not medical claims.
# ============================================================

