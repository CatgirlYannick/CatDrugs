# ============================================================
# CatDrugs - main configuration
# ============================================================
# Purpose:
#   Global features, consumption rules, and safety limits.
#
# Notes:
#   - /catdrugs reload safely reloads this file.
#   - Substances and effects are configured separately in drugs.yml.
#   - All recipes are fictional Minecraft recipes and do not represent
#     real production methods.
# ============================================================

config-version: 1

general:
  enabled: true
  language: "en"
  debug: false

features:
  consumption:
    enabled: true
  overdose:
    enabled: true

# Animated intake sequences. CatItems 0.5+ renders these as smooth player emotes;
# CatDrugs keeps a smaller fallback so the plugin remains independently usable.
consumption-animations:
  schema-version: 2
  enabled: true
  default-duration-ticks: 32
  duration-by-preset:
    smoke_joint: 48
    smoke_pipe: 52
    smoke_stimulant: 34
    snort_line: 38
    drink_bottle: 40
    eat_edible: 44
    inhale_vape: 42
    inject_arm: 42
    ritual_sway: 58
    swallow_pill: 32
  category-presets:
    cannabis: "smoke_joint"
    stimulant: "snort_line"
    party: "snort_line"
    dissociative: "snort_line"
    depressant: "drink_bottle"
    sedative: "drink_bottle"
    herbal: "eat_edible"
    inhalant: "inhale_vape"
    synthetic: "inhale_vape"
    opioid: "inject_arm"
    medical: "inject_arm"
    psychedelic: "ritual_sway"
  drug-overrides:
    weed: "smoke_joint"
    joint: "smoke_joint"
    hashish: "smoke_pipe"
    opium: "smoke_pipe"
    meth: "smoke_stimulant"
    crack: "smoke_stimulant"
    cocaine: "snort_line"
    ketamine: "snort_line"
    cannabis_oil: "inhale_vape"
    nicotine: "inhale_vape"
    dmt: "inhale_vape"
    edible: "eat_edible"
    coca_leaf: "eat_edible"
    heroin: "inject_arm"
    fentanyl: "inject_arm"
    morphine: "inject_arm"
    caffeine: "drink_bottle"
    alcohol: "drink_bottle"
    absinthe: "drink_bottle"
    moonshine: "drink_bottle"

overdose:
  # Dose points are added within this time window.
  window-seconds: 300
  # Configured negative gameplay effects apply at this value.
  threshold-points: 10
  # Direct Minecraft damage; 6.0 equals three hearts.
  damage: 6.0

dose-reactions:
  enabled: true
  # Reactions trigger once when the accumulated points cross a threshold.
  nausea-threshold-points: 6
  vomiting-threshold-points: 10
  blackout-threshold-points: 16
  blackout-duration-seconds: 7
  # Hard-limited by the plugin to a maximum of 150 blocks.
  blackout-radius-blocks: 150
  safe-location-attempts: 24
  vomiting:
    bursts: 5
    interval-ticks: 8
    particle-count: 18
    food-loss: 4
    saturation-loss: 5.0
    exhaustion: 1.8
    movement-retention: 0.35

logging:
  level: "INFO"
  log-consumption: false
  log-dealer-conversion: true

catitems:
  addon:
    # Installs item definitions, textures, and the pharmacist texture into an
    # existing CatItems plugin. CatDrugs also works without CatItems.
    auto-install: true
    # After changes, CatDrugs reloads CatItems and rebuilds its pack.
    rebuild-after-install: true
    # false protects definitions and assets customized by an administrator.
    overwrite-customized-files: false

advanced:
  # Strict validation prevents startup with damaged definitions.
  strict-config-validation: true
