# ============================================================
# CatDrugs - phased symptom profiles
# ============================================================
# Fictional gameplay abstraction informed by broad health-risk categories.
# This is not medical advice and does not define safe doses or real timing.
# Custom effects: heartbeat, tremor, impaired_coordination, dehydration,
# respiratory_depression, perception_shift, sedation, fatigue, appetite,
# overheating, dizziness, camera_drift, visual_echo, auditory_distortion,
# focus_pulse, time_distortion, muscle_tension.
# ============================================================

config-version: 2
enabled: true
replace-legacy-effects: true
phase-messages: true

# Individual drugs can use a more suitable profile than their shop category.
drug-overrides:
  mdma: party
  ecstasy: party
  molly: party
  alcohol: depressant
  absinthe: depressant
  moonshine: depressant
  spice: synthetic
  kratom: herbal
  kava: herbal

profiles:
  stimulant:
    phases:
      onset:
        delay-seconds: 2
        potion-effects:
          - {type: speed, duration-seconds: 32, amplifier: 1}
          - {type: haste, duration-seconds: 32, amplifier: 1}
        custom-effects:
          - {type: heartbeat, duration-seconds: 42, interval-ticks: 34, intensity: 2}
          - {type: tremor, duration-seconds: 30, interval-ticks: 55, intensity: 1}
          - {type: focus_pulse, duration-seconds: 34, interval-ticks: 40, intensity: 2}
      peak:
        delay-seconds: 16
        potion-effects:
          - {type: strength, duration-seconds: 20, amplifier: 0}
          - {type: hunger, duration-seconds: 36, amplifier: 1}
        custom-effects:
          - {type: dehydration, duration-seconds: 42, interval-ticks: 70, intensity: 2}
          - {type: overheating, duration-seconds: 30, interval-ticks: 90, intensity: 1}
          - {type: muscle_tension, duration-seconds: 34, interval-ticks: 48, intensity: 2}
      comedown:
        delay-seconds: 46
        potion-effects:
          - {type: weakness, duration-seconds: 42, amplifier: 1}
          - {type: slowness, duration-seconds: 28, amplifier: 0}
        custom-effects:
          - {type: fatigue, duration-seconds: 45, interval-ticks: 60, intensity: 2}

